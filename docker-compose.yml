# ──────────────────────────────────────────────────────────────
#  NeuroRoute — Docker Compose Topology (Embedded ML Upgrade)
#  AI-Driven Predictive Layer 7 Load Balancer
# ──────────────────────────────────────────────────────────────

networks:
  neuronet:
    driver: bridge

volumes:
  traffic_data:

services:
  # ── Go Reverse Proxy Gateway ──────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: neuroroute-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - FAST_WORKER_URLS=http://worker_1:8080,http://worker_2:8080
      - MEDIUM_WORKER_URLS=http://worker_3:8080
      - SLOW_WORKER_URLS=http://worker_4:8080,http://worker_5:8080
      - SMART_ROUTING=${SMART_ROUTING:-false}
      - TRAFFIC_LOG_PATH=${TRAFFIC_LOG_PATH:-/data/traffic.csv}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - traffic_data:/data
    networks:
      - neuronet
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      worker_1:
        condition: service_started
      worker_2:
        condition: service_started
      worker_3:
        condition: service_started
      worker_4:
        condition: service_started
      worker_5:
        condition: service_started
    restart: unless-stopped

  # ── Fast Lane Workers (Class 0: Light Requests) ───────────
  worker_1:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: neuroroute-worker-1
    ports:
      - "${WORKER_1_PORT:-8001}:8080"
    environment:
      - WORKER_ID=1
      - PORT=8080
    networks:
      - neuronet
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  worker_2:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: neuroroute-worker-2
    ports:
      - "${WORKER_2_PORT:-8002}:8080"
    environment:
      - WORKER_ID=2
      - PORT=8080
    networks:
      - neuronet
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  # ── Medium Lane Worker (Class 1: Medium Requests) ─────────
  worker_3:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: neuroroute-worker-3
    ports:
      - "${WORKER_3_PORT:-8003}:8080"
    environment:
      - WORKER_ID=3
      - PORT=8080
    networks:
      - neuronet
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  # ── Slow Lane Workers (Class 2: Heavy Requests) ───────────
  worker_4:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: neuroroute-worker-4
    ports:
      - "${WORKER_4_PORT:-8004}:8080"
    environment:
      - WORKER_ID=4
      - PORT=8080
    networks:
      - neuronet
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    restart: unless-stopped

  worker_5:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: neuroroute-worker-5
    ports:
      - "${WORKER_5_PORT:-8005}:8080"
    environment:
      - WORKER_ID=5
      - PORT=8080
    networks:
      - neuronet
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    restart: unless-stopped
